<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>播种幸福｜工具箱使用指南</title>
<style>
:root{--g:#355a42;--s:#dfe9db;--c:#f7f1e6;--p:#fffdf8;--m:#777e76;--l:#dde6da}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf3e9,#faf5ec);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#30362f}.shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.app{width:min(520px,100%);height:min(860px,calc(100vh - 32px));min-height:650px;background:var(--p);border-radius:28px;overflow:hidden;position:relative;box-shadow:0 22px 60px #355a4220}.track{height:100%;display:flex;transition:.4s;touch-action:pan-y}.slide{min-width:100%;height:100%;overflow:auto;padding:24px 21px 115px;background:radial-gradient(circle at 100% 0,#c4a46c18,transparent 28%),linear-gradient(#fffdf8,#f7f2e9)}.cover{background:linear-gradient(145deg,#355a42,#56755e);color:white;display:flex;flex-direction:column;justify-content:center}.brand{font-size:13px;font-weight:900;letter-spacing:1px;color:#54735d}.cover .brand{color:#e5efe2}.step{font-size:12px;font-weight:900;color:#b28e53;letter-spacing:1px}h1{font-size:39px;line-height:1.15;margin:13px 0}h2{font-size:28px;line-height:1.25;color:var(--g);margin:8px 0 10px}.lead{color:var(--m);line-height:1.7;font-size:15px}.cover .lead{color:#edf5eb}.box,.scene,.record{background:white;border:1px solid var(--l);border-radius:17px;padding:14px;margin:10px 0}.box strong,.scene b,.record h4{color:var(--g)}.box p,.scene small,.record p{display:block;color:var(--m);font-size:13px;line-height:1.55;margin:5px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.demo{background:#eef5ea;border:1px solid var(--l);border-radius:20px;padding:15px}.q{padding:9px 0;border-bottom:1px dashed #ccd8ca}.rec{background:var(--g);color:white;padding:12px;border-radius:13px;margin-top:12px;font-weight:900}.field{background:white;border:1px solid var(--l);border-radius:14px;padding:11px;margin:8px 0;color:var(--g);font-weight:800;font-size:13px}.fake{height:30px;background:#fafcf9;border:1px solid #e1e7df;border-radius:8px;margin-top:7px}.buttons{display:flex;gap:7px;margin-top:10px}.btn{flex:1;text-align:center;background:var(--g);color:white;border-radius:11px;padding:9px;font-weight:900;font-size:12px;border:0;cursor:pointer}.btn.alt{background:var(--s);color:var(--g)}.note{background:#fff6e5;border:1px solid #ead8b2;border-radius:14px;padding:12px;color:#6f634e;font-size:13px;line-height:1.55;margin:12px 0}.progress{margin:14px 0}.ph{display:flex;justify-content:space-between;color:var(--g);font-size:13px;font-weight:900}.bar{height:9px;background:#e4ebe1;border-radius:999px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}.stages{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stage{background:white;border:1px solid var(--l);border-radius:13px;padding:10px;text-align:center;color:var(--g);font-size:12px;font-weight:900}.stage span{display:block;font-size:27px}.cert{border:7px double #d6c294;background:#fffef9;padding:20px;text-align:center;margin:14px 0}.cert b{font-size:24px;color:var(--g)}.start{background:var(--g);color:white;border-radius:20px;padding:18px;line-height:1.7}.controls{position:absolute;bottom:0;left:0;right:0;padding:27px 16px 14px;background:linear-gradient(transparent,#fffdf8 30%);display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.nav{border:0;width:44px;height:44px;border-radius:50%;background:var(--g);color:white;font-size:20px}.nav:disabled{opacity:.25}.center{text-align:center}.count{font-size:11px;color:var(--m)}.dots{display:flex;justify-content:center;gap:4px;margin-top:6px}.dot{width:6px;height:6px;border-radius:50%;background:#ccd6ca}.dot.on{width:18px;border-radius:8px;background:var(--g)}.topbar{position:absolute;z-index:5;top:12px;right:14px;display:flex;gap:6px}.topbar button{border:1px solid #ffffff55;background:#ffffffdd;color:var(--g);border-radius:999px;padding:7px 10px;font-weight:900;font-size:11px}.topbar button.active{background:var(--g);color:#fff}.cover .topbar button{background:#ffffff22;color:#fff}.cover .topbar button.active{background:#fff;color:var(--g)}.launch{width:100%;margin-top:14px;padding:12px;font-size:14px}@media(max-width:480px){.shell{padding:0}.app{width:100%;height:100vh;min-height:0;border-radius:0}}
</style></head><body><div class="shell"><main class="app"><div class="topbar"><button id="zhBtn" onclick="setLang('zh')">中文</button><button id="enBtn" onclick="setLang('en')">English</button></div><div class="track" id="track"></div><div class="controls"><button class="nav" id="prev">‹</button><div class="center"><div class="count" id="count"></div><div class="dots" id="dots"></div></div><button class="nav" id="next">›</button></div></main></div>
<script>
const bi=(zh,en)=>({zh,en});let LANG=(new URLSearchParams(location.search).get('lang')||localStorage.getItem('bzxf_lang')||localStorage.getItem('bozhongxingfu_lang')||'zh')==='en'?'en':'zh';const L=x=>x[LANG];
const slides=[
{cover:true,html:bi('<div class="brand">🌱 播种幸福</div><h1>13项幸福人生工具箱</h1><p class="lead">新学员使用指南<br><br>不知道该用哪一个工具？跟着这个指南，从「我现在怎么了」开始。</p><div style="margin-top:22px;font-weight:900">向左滑动开始 →</div>','<div class="brand">🌱 Planting Happiness</div><h1>13 Happiness Life Tools</h1><p class="lead">New Participant Guide<br><br>Not sure which tool to use? Start with one simple question: “What do I need right now?”</p><div style="margin-top:22px;font-weight:900">Swipe left to begin →</div>')},
{html:bi('<div class="step">STEP 01</div><h2>第一次使用，先从这里开始</h2><p class="lead">你有两种方法，不需要一次完成13项。</p><div class="box"><strong>🧭 不知道用什么？</strong><p>点击「我现在需要什么？」先选择目前的状态，系统会推荐适合的工具。</p></div><div class="box"><strong>🧰 已经知道用什么？</strong><p>直接从「工具首页」选择幸福日记、感恩记录、关系修复卡等。</p></div><div class="note">🌿 每次只处理一个最需要的问题。小 · 真 · 久。</div>','<div class="step">STEP 01</div><h2>First time here? Start with this</h2><p class="lead">There are two simple ways to begin. You do not need to use all 13 tools at once.</p><div class="box"><strong>🧭 Not sure which tool to use?</strong><p>Choose “What Do I Need Now?” and select your current situation. The system will suggest a suitable tool.</p></div><div class="box"><strong>🧰 Already know what you need?</strong><p>Go straight to Tools Home and choose the Happiness Journal, Gratitude Record, Relationship Repair Card, or another tool.</p></div><div class="note">🌿 Work on one real need at a time. Small · Real · Consistent.</div>')},
{html:bi('<div class="step">STEP 02</div><h2>先选择你现在的状态</h2><div class="grid"><div class="scene"><b>😟 情绪很乱</b><small>焦虑、难过、生气、压力</small></div><div class="scene"><b>❤️ 关系问题</b><small>争吵、误会、冷战</small></div><div class="scene"><b>💰 担心钱</b><small>压力、缺乏感、担心未来</small></div><div class="scene"><b>💼 事业迷茫</b><small>没方向、不知道下一步</small></div><div class="scene"><b>🔄 坚持不了</b><small>拖延、中断、习惯停掉</small></div><div class="scene"><b>🧭 不知怎么选</b><small>犹豫、担心选错</small></div></div>','<div class="step">STEP 02</div><h2>Choose your current situation</h2><div class="grid"><div class="scene"><b>😟 Emotions feel overwhelming</b><small>Anxiety, sadness, anger, pressure</small></div><div class="scene"><b>❤️ Relationship problem</b><small>Arguments, misunderstanding, silence</small></div><div class="scene"><b>💰 Worried about money</b><small>Pressure, scarcity, uncertainty</small></div><div class="scene"><b>💼 Career feels unclear</b><small>No direction or next step</small></div><div class="scene"><b>🔄 I stopped again</b><small>Procrastination, interruption, low motivation</small></div><div class="scene"><b>🧭 I cannot decide</b><small>Hesitation, fear of choosing wrongly</small></div></div>')},
{html:bi('<div class="step">STEP 03</div><h2>系统先帮你整理，再推荐工具</h2><p class="lead">例如选择「😟 我的情绪很乱」：</p><div class="demo"><b>😟 A｜我的情绪很乱</b><div class="q">发生了什么？</div><div class="q">我现在最需要什么？</div><div class="q">什么是我能够控制的？</div><div class="q">接下来10分钟，我可以做什么？</div><div class="rec">👉 建议使用：🌿 幸福复原卡</div></div>','<div class="step">STEP 03</div><h2>Let the system organise the situation first</h2><p class="lead">For example, if you choose “😟 My emotions feel overwhelming”:</p><div class="demo"><b>😟 A | My emotions feel overwhelming</b><div class="q">What happened?</div><div class="q">What do I need most right now?</div><div class="q">What can I control?</div><div class="q">What can I do in the next 10 minutes?</div><div class="rec">👉 Recommended: 🌿 Happiness Recovery Card</div></div>')},
{html:bi('<div class="step">STEP 04</div><h2>跟着问题填写</h2><p class="lead">不需要写得完美，写真实、具体、现在能做到的内容就可以。</p><div class="field">现在发生了什么？只写事实。<div class="fake"></div></div><div class="field">我现在最需要什么？<div class="fake"></div></div><div class="field">哪些是我能控制的？<div class="fake"></div></div><div class="field">我可以做的最小下一步<div class="fake"></div></div><div class="buttons"><div class="btn">保存这份记录</div><div class="btn alt">清空</div></div>','<div class="step">STEP 04</div><h2>Answer the guided questions</h2><p class="lead">You do not need perfect answers. Write something real, specific, and possible right now.</p><div class="field">What is happening right now? Write only the facts.<div class="fake"></div></div><div class="field">What do I need most right now?<div class="fake"></div></div><div class="field">What can I control?<div class="fake"></div></div><div class="field">What is my smallest next step?<div class="fake"></div></div><div class="buttons"><div class="btn">Save This Record</div><div class="btn alt">Clear</div></div>')},
{html:bi('<div class="step">STEP 05</div><h2>保存后，可以回来修改</h2><p class="lead">在「📚 全部记录」会看到清楚的题目与回答。</p><div class="record"><h4>我现在最需要什么？</h4><p>先让自己安静下来，再处理最重要的一件事。</p><div class="buttons"><div class="btn alt">编辑</div><div class="btn alt">删除</div></div></div><div class="note">按「编辑」后会带回原内容；修改后按「更新这份记录」。</div>','<div class="step">STEP 05</div><h2>You can edit a saved record later</h2><p class="lead">Open “📚 All Records” to see your saved questions and answers clearly.</p><div class="record"><h4>What do I need most right now?</h4><p>Slow down first, then deal with the most important thing.</p><div class="buttons"><div class="btn alt">Edit</div><div class="btn alt">Delete</div></div></div><div class="note">Choose “Edit” to bring the saved answers back into the form, then choose “Update This Record”.</div>')},
{html:bi('<div class="step">STEP 06</div><h2>每次保存，累积实践进度</h2><p class="lead">同一天可以使用多个工具，但实践天数一天最多计算一次。</p><div class="progress"><div class="ph"><span>🌱 7天幸福挑战</span><span>5 / 7</span></div><div class="bar"><i style="width:71%"></i></div></div><div class="progress"><div class="ph"><span>🌿 21天幸福实践</span><span>5 / 21</span></div><div class="bar"><i style="width:24%"></i></div></div><div class="progress"><div class="ph"><span>🌳 30天幸福习惯</span><span>5 / 30</span></div><div class="bar"><i style="width:17%"></i></div></div>','<div class="step">STEP 06</div><h2>Every saved practice builds your progress</h2><p class="lead">You can use several tools on the same date, but each calendar day counts as one practice day.</p><div class="progress"><div class="ph"><span>🌱 7-Day Happiness Challenge</span><span>5 / 7</span></div><div class="bar"><i style="width:71%"></i></div></div><div class="progress"><div class="ph"><span>🌿 21-Day Happiness Practice</span><span>5 / 21</span></div><div class="bar"><i style="width:24%"></i></div></div><div class="progress"><div class="ph"><span>🌳 30-Day Happiness Habit</span><span>5 / 30</span></div><div class="bar"><i style="width:17%"></i></div></div>')},
{html:bi('<div class="step">STEP 07</div><h2>幸福花园会慢慢长大</h2><div class="stages"><div class="stage"><span>🌰</span>1–2天｜种子</div><div class="stage"><span>🌱</span>3–7天｜发芽</div><div class="stage"><span>🌿</span>8–15天｜成长</div><div class="stage"><span>🪻</span>16–20天｜花苞</div><div class="stage"><span>🌷</span>21–29天｜开花</div><div class="stage"><span>🌳</span>30天｜幸福花园</div></div><div class="note">花园不是成绩排名，而是帮助你看见自己的持续。中断也没关系，重新开始就好。</div>','<div class="step">STEP 07</div><h2>Your Happiness Garden grows gradually</h2><div class="stages"><div class="stage"><span>🌰</span>Days 1–2 | Seed</div><div class="stage"><span>🌱</span>Days 3–7 | Sprout</div><div class="stage"><span>🌿</span>Days 8–15 | Growth</div><div class="stage"><span>🪻</span>Days 16–20 | Bud</div><div class="stage"><span>🌷</span>Days 21–29 | Bloom</div><div class="stage"><span>🌳</span>Day 30 | Garden</div></div><div class="note">The garden is not a ranking. It helps you see your consistency. If you stop, you can simply begin again.</div>')},
{html:bi('<div class="step">STEP 08</div><h2>21天完成证书</h2><p class="lead">累积至少21个不同实践日后，就达到21天完成条件。</p><div class="cert">🌱 播种幸福<br><br><b>完成证书</b><p>为自己的持续练习与行动留下纪念。</p></div><div class="note">证书代表完成实践周期，不代表保证任何特定人生结果。</div>','<div class="step">STEP 08</div><h2>21-Day Completion Certificate</h2><p class="lead">After at least 21 different practice days, you meet the completion requirement.</p><div class="cert">🌱 Planting Happiness<br><br><b>Certificate of Completion</b><p>A record of your consistent practice and action.</p></div><div class="note">The certificate represents completion of the practice cycle. It does not guarantee any specific life outcome.</div>')},
{html:bi('<div class="step">STEP 09</div><h2>备份与恢复资料</h2><div class="box"><strong>✓ 同一设备 + 同一浏览器</strong><p>一般情况下重新打开仍可看到记录。</p></div><div class="box"><strong>⬇️ 定期导出全部备份</strong><p>把自己的记录保存成 JSON 备份文件。</p></div><div class="box"><strong>⬆️ 需要时恢复备份</strong><p>点击「恢复备份」→ 选择之前导出的 JSON → 系统先显示记录数量 → 确认后恢复。</p></div><div class="note">🛡️ 恢复前，系统会先自动下载一份「恢复前安全备份」，避免目前资料直接丢失。</div>','<div class="step">STEP 09</div><h2>Backup and restore your data</h2><div class="box"><strong>✓ Same device + same browser</strong><p>Your records normally remain when you reopen the tool.</p></div><div class="box"><strong>⬇️ Export a backup regularly</strong><p>Save your records as a JSON backup file.</p></div><div class="box"><strong>⬆️ Restore when needed</strong><p>Choose “Restore Backup” → select your exported JSON → review the record count → confirm the restore.</p></div><div class="note">🛡️ Before restoring, the system automatically downloads a pre-restore safety backup so your current data is not simply lost.</div>')},
{html:bi('<div class="step">STEP 10</div><h2>现在，可以开始了 🌱</h2><div class="start"><b>记住这个顺序：</b><br>我现在怎么了？<br>↓<br>选择适合的工具<br>↓<br>完成一个小练习<br>↓<br>保存记录<br>↓<br>看见进度与花园成长</div><div class="box"><strong>🌿 小 · 真 · 久</strong><p>做得小一点，写得真实一点，坚持久一点。</p></div><p style="text-align:center;color:#355a42;font-weight:900">每天一点点，重新练习幸福。</p><button class="btn launch" onclick="openToolbox()">进入13项幸福工具箱 →</button>','<div class="step">STEP 10</div><h2>You are ready to begin 🌱</h2><div class="start"><b>Remember this flow:</b><br>What do I need right now?<br>↓<br>Choose the right tool<br>↓<br>Complete one small practice<br>↓<br>Save the record<br>↓<br>See your progress and garden grow</div><div class="box"><strong>🌿 Small · Real · Consistent</strong><p>Make it smaller, write honestly, and keep going.</p></div><p style="text-align:center;color:#355a42;font-weight:900">A little every day. Practice happiness again.</p><button class="btn launch" onclick="openToolbox()">Open the 13 Happiness Life Tools →</button>')}
];
const t=document.getElementById('track'),d=document.getElementById('dots'),c=document.getElementById('count');let i=0,x=0,dx=0;
function render(){document.documentElement.lang=LANG==='en'?'en':'zh-Hans';t.innerHTML=slides.map(s=>`<section class="slide ${s.cover?'cover':''}">${L(s.html)}</section>`).join('');d.innerHTML=slides.map((_,j)=>`<span class="dot" data-i="${j}"></span>`).join('');document.querySelectorAll('.dot').forEach(q=>q.onclick=()=>go(+q.dataset.i));document.getElementById('zhBtn').classList.toggle('active',LANG==='zh');document.getElementById('enBtn').classList.toggle('active',LANG==='en');go(i)}
function setLang(v){LANG=v==='en'?'en':'zh';localStorage.setItem('bozhongxingfu_lang',LANG);localStorage.setItem('bzxf_lang',LANG);const u=new URL(location.href);u.searchParams.set('lang',LANG);history.replaceState(null,'',u);render()}window.setLang=setLang;
function go(n){i=Math.max(0,Math.min(slides.length-1,n));t.style.transform=`translateX(-${i*100}%)`;document.querySelectorAll('.dot').forEach((q,j)=>q.classList.toggle('on',j===i));c.textContent=`${i+1} / ${slides.length}`;prev.disabled=i===0;next.disabled=i===slides.length-1}prev.onclick=()=>go(i-1);next.onclick=()=>go(i+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(i-1);if(e.key==='ArrowRight')go(i+1)});t.addEventListener('touchstart',e=>{x=e.touches[0].clientX;dx=0},{passive:true});t.addEventListener('touchmove',e=>dx=e.touches[0].clientX-x,{passive:true});t.addEventListener('touchend',()=>{if(Math.abs(dx)>45)go(i+(dx<0?1:-1))});function openToolbox(){location.href='index.html?lang='+LANG}window.openToolbox=openToolbox;render();
</script></body></html>
